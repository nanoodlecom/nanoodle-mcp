# Template: copy to <repo>/.github/workflows/deploy.yml, set APP_NAME.
# Repo secret DEPLOY_SSH_KEY = contents of /root/.ssh/deploy_key on the box
# (key is locked to the deploy-app forced command — it cannot run anything else).
#
# mcp.nanoodle.com loads graphs from a host directory that refreshes only when
# this deploy runs. awesome-noodles never pushes this repo, so a graph fix
# there misses the push trigger. repository_dispatch type
# awesome-noodles-updated runs this same job. The caller is a workflow on
# awesome-noodles main; it authenticates with a token secret added on that
# repo, not with a secret in this one.
name: deploy
on:
  push:
    branches: [main, master]
  repository_dispatch:
    types: [awesome-noodles-updated]
# Pushes and dispatches share one group so two deploys cannot overlap on the box.
concurrency:
  group: nanoodle-mcp-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to 255labs box
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "159.195.17.119 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHcFN8/48EuW9f6MXgGx9a/syadihZ4XpY+EazT2KbQe" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts root@159.195.17.119 "nanoodle-mcp"

      # The curated comment node still says "Spicy" after the model swap.
      # Only node model fields are checked. Retry so a restart cannot fail a good deploy.
      - name: Check photo-to-video is off the spicy model
        run: |
          python3 - <<'PY'
          import json, sys, time, urllib.request

          url = "https://mcp.nanoodle.com/graph/photo-to-video.json"
          last = "photo-to-video check did not run"
          for attempt in range(1, 6):
              try:
                  req = urllib.request.Request(
                      url + "?deploy-check=" + str(attempt),
                      headers={"Cache-Control": "no-cache", "Pragma": "no-cache"},
                  )
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      data = json.load(resp)
                  models = []
                  for node in data.get("nodes") or []:
                      model = (node.get("fields") or {}).get("model")
                      if isinstance(model, str) and model:
                          models.append(model)
                  shown = ", ".join(models) if models else "(none)"
                  print("attempt %d models: %s" % (attempt, shown), flush=True)
                  if not models:
                      last = "photo-to-video graph has no model fields"
                  else:
                      spicy = [m for m in models if "spicy" in m.lower()]
                      if not spicy:
                          sys.exit(0)
                      last = "model contains spicy: " + ", ".join(spicy)
              except Exception as exc:
                  last = "fetch failed: %s" % exc
                  print("attempt %d %s" % (attempt, last), flush=True)
              if attempt < 5:
                  time.sleep(3)
          sys.stderr.write(last + "\n")
          sys.exit(1)
          PY
