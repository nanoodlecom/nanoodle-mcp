# Repo secret DEPLOY_SSH_KEY = contents of /root/.ssh/deploy_key on the box
# (key is locked to the deploy-app forced command — it cannot run anything else).
name: deploy
on:
  workflow_run:
    workflows: [test]
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: nanoodle-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to 255labs box
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          TESTED_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$TESTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p ~/.ssh
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "159.195.17.119 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHcFN8/48EuW9f6MXgGx9a/syadihZ4XpY+EazT2KbQe" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts root@159.195.17.119 "nanoodle-mcp $TESTED_REVISION"
