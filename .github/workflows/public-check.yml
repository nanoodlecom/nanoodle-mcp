name: public availability

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/public-check.yml
      - scripts/public-mcp-check.mjs
      - scripts/market-check.mjs
      - scripts/atomic-json.mjs
      - src/probe-http.mjs
      - src/public-mcp-check.mjs
      - src/market/fee-guard.mjs
      - src/market/public-availability.mjs
      - src/near/rpc.mjs
      - src/near/watch.mjs
      - tests/market-check.test.mjs
      - tests/public-mcp-check.test.mjs

permissions:
  contents: read

concurrency:
  group: public-availability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - name: Check public MCP, payment readiness and Babel ingress
        run: node scripts/public-mcp-check.mjs | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
      - name: Check public NEAR AI Market and Nanoodle listings
        if: ${{ !cancelled() }}
        env:
          CHECK_STATE_DIR: ${{ runner.temp }}/nanoodle-market-public
        shell: bash
        run: node scripts/market-check.mjs | tee -a "$GITHUB_STEP_SUMMARY"
