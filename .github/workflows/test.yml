name: test

# The suite spawns the real server against a canned local NanoGPT stub. Nothing
# here spends money or needs a secret. One test HEADs the landing page's public
# preview images on media.nanoodle.com; NANOODLE_OFFLINE=1 skips it.
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  # Only a tested version change on main creates a GitHub source release.
  qualify-github-source:
    name: Qualify GitHub source release
    if: github.event_name == 'pull_request' || (github.repository == 'nanoodlecom/nanoodle-mcp' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.qualify.outputs.source_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.3'
      - name: Compare the packaged version with the prior main commit
        id: qualify
        env:
          BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/source-pack.json"
          node .github/scripts/publish_source.mjs qualify "$RUNNER_TEMP/source-pack.json" >> "$GITHUB_OUTPUT"

  publish-github-source:
    name: Publish tested GitHub source release
    if: ${{ github.repository == 'nanoodlecom/nanoodle-mcp' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.qualify-github-source.outputs.version != '' }}
    needs: qualify-github-source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: github-source-${{ needs.qualify-github-source.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.3'
      - name: Tag and release the tested source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_VERSION: ${{ needs.qualify-github-source.outputs.version }}
        run: node .github/scripts/publish_source.mjs publish "$SOURCE_VERSION"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.3"
      - name: Restore pinned ffmpeg archive
        id: ffmpeg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
        with:
          path: /tmp/ffmpeg.tar.xz
          key: ffmpeg-7.0.2-linux-amd64-abda8d77ce8309141f83ab8edf0596834087c52467f6badf376a6a2a4c87cf67
      # The apt ffmpeg package is about 94MB across 99 dependencies, fetched
      # from the Azure Ubuntu mirror. That download has no bound of its own,
      # and this job's 10-minute limit has cancelled the run while libavcodec
      # was still transferring. Tests only need ffmpeg and ffprobe, including
      # the lavfi color source, so install one pinned static build instead.
      - name: Install ffmpeg
        run: |
          set -euo pipefail
          url=https://johnvansickle.com/ffmpeg/releases/ffmpeg-7.0.2-amd64-static.tar.xz
          verify_ffmpeg() {
            echo "abda8d77ce8309141f83ab8edf0596834087c52467f6badf376a6a2a4c87cf67  /tmp/ffmpeg.tar.xz" | sha256sum -c
          }
          if ! { test -f /tmp/ffmpeg.tar.xz && verify_ffmpeg; }; then
            for attempt in 1 2; do
              rm -f /tmp/ffmpeg.tar.xz
              if curl -fsSL --connect-timeout 10 --max-time 45 -H 'Cache-Control: no-cache' "$url" -o /tmp/ffmpeg.tar.xz && verify_ffmpeg; then
                break
              fi
            done
          fi
          # Cache hits and both download attempts must pass the unchanged pin.
          verify_ffmpeg
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
          sudo install -m 755 /tmp/ffmpeg-7.0.2-amd64-static/ffmpeg /tmp/ffmpeg-7.0.2-amd64-static/ffprobe /usr/local/bin/
          ffmpeg -hide_banner -version
          ffprobe -hide_banner -version
      - name: Cache verified ffmpeg archive
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: /tmp/ffmpeg.tar.xz
          key: ffmpeg-7.0.2-linux-amd64-abda8d77ce8309141f83ab8edf0596834087c52467f6badf376a6a2a4c87cf67
      - run: npm ci
      - run: npm test

  package:
    name: Pack and install the MCP release
    if: github.event_name == 'pull_request' || (github.repository == 'nanoodlecom/nanoodle-mcp' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - name: Build and install the release tarball outside the checkout
        id: pack
        run: |
          npm ci --omit=dev --ignore-scripts
          mkdir "$RUNNER_TEMP/consumer"
          version="$(node -p 'require("./package.json").version')"
          sdk_version="$(node -p 'require("./package-lock.json").packages["node_modules/nanoodle"].version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/nanoodle-mcp-$version.tgz" "$RUNNER_TEMP/nanoodle-mcp.tgz"
          cd "$RUNNER_TEMP/consumer"
          npm install --omit=dev --ignore-scripts "$RUNNER_TEMP/nanoodle-mcp.tgz"
          installed_sdk="$(node -p 'require("./node_modules/nanoodle-mcp/node_modules/nanoodle/package.json").version')"
          test "$installed_sdk" = "$sdk_version"
          test "$(node_modules/.bin/nanoodle-mcp --version)" = "nanoodle-mcp $version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: npm-distribution
          path: ${{ runner.temp }}/nanoodle-mcp.tgz
          if-no-files-found: error

  publish-npm:
    name: Publish the tested npm package
    if: github.repository == 'nanoodlecom/nanoodle-mcp' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    environment:
      name: npm
      url: https://www.npmjs.com/package/nanoodle-mcp/v/${{ needs.package.outputs.version }}
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-distribution
      - name: Publish if this version is absent from npm
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          status="$(curl --silent --show-error --retry 2 --max-time 30 \
            --output "$RUNNER_TEMP/npm-version.json" --write-out '%{http_code}' \
            "https://registry.npmjs.org/nanoodle-mcp/$VERSION")"
          case "$status" in
            200)
              jq -e --arg version "$VERSION" '.name == "nanoodle-mcp" and .version == $version and .mcpName == "io.github.nanoodlecom/nanoodle-mcp"' \
                "$RUNNER_TEMP/npm-version.json" >/dev/null
              echo "nanoodle-mcp@$VERSION is already published"
              ;;
            404)
              flags=()
              if [[ "$VERSION" == *-* ]]; then flags+=(--tag next); fi
              npm publish ./nanoodle-mcp.tgz --ignore-scripts --access public "${flags[@]}"
              ;;
            *) echo "npm version lookup returned HTTP $status" >&2; exit 1 ;;
          esac

  publish-registry:
    name: Publish to the MCP Registry
    needs: publish-npm
    uses: ./.github/workflows/publish-mcp-registry.yml
    permissions:
      contents: read
      id-token: write
