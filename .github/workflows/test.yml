name: test

# The suite spawns the real server against a canned local NanoGPT stub. Nothing
# here spends money or needs a secret. One test HEADs the landing page's public
# preview images on media.nanoodle.com; NANOODLE_OFFLINE=1 skips it.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm test
