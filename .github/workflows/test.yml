name: test

# The suite spawns the real server against a canned local NanoGPT stub. Nothing
# here spends money or needs a secret. One test HEADs the landing page's public
# preview images on media.nanoodle.com; NANOODLE_OFFLINE=1 skips it.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Exact MCP version on main to publish
        required: true
        type: string
      github_source_only:
        description: Recover a missing GitHub source release
        type: boolean
        default: false
      deployed_revision:
        description: Exact hosted revision when dispatched by the deployment workflow
        type: string

permissions:
  contents: read

env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_DIR: /etc/ssl/certs
  npm_config_cafile: /etc/ssl/certs/ca-certificates.crt
  npm_config_strict_ssl: "true"

jobs:
  # Main pushes qualify the release. Publication and recovery run after hosted activation.
  qualify-github-source:
    name: Qualify GitHub source release
    if: github.event_name == 'pull_request' || (github.repository == 'nanoodlecom/nanoodle-mcp' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.qualify.outputs.source_version }}
    steps:
      - name: Patch system trust before dependency or release downloads
        timeout-minutes: 2
        run: |
          minimum=20260816ubuntu0.24.04.1
          installed="$(dpkg-query -W -f='${Version}' ca-certificates)"
          if ! dpkg --compare-versions "$installed" ge "$minimum"; then
            sudo apt-get update
            sudo apt-get install -y --only-upgrade ca-certificates
            dpkg --compare-versions "$(dpkg-query -W -f='${Version}' ca-certificates)" ge "$minimum"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.3'
      - name: Verify hosted activation before publication or recovery
        if: github.event_name == 'workflow_dispatch'
        env:
          DEPLOYED_REVISION: ${{ inputs.deployed_revision }}
        run: |
          if [[ -n "$DEPLOYED_REVISION" ]]; then test "$DEPLOYED_REVISION" = "$GITHUB_SHA"; fi
          bash .github/scripts/check-hosted-revision.sh "$GITHUB_SHA"
      - name: Qualify the packaged version for a GitHub source release
        id: qualify
        env:
          BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
          SOURCE_ONLY: ${{ inputs.github_source_only || inputs.deployed_revision != '' }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/source-pack.json"
          node .github/scripts/publish_source.mjs qualify "$RUNNER_TEMP/source-pack.json" >> "$GITHUB_OUTPUT"
      - name: Record a qualified version change for the deployment workflow
        if: github.event_name == 'push' && steps.qualify.outputs.source_version != ''
        env:
          RELEASE_VERSION: ${{ steps.qualify.outputs.source_version }}
        run: printf '%s\n' "$RELEASE_VERSION" > "$RUNNER_TEMP/hosted-release-version"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && steps.qualify.outputs.source_version != ''
        continue-on-error: true
        with:
          name: hosted-release-intent-v${{ steps.qualify.outputs.source_version }}
          path: ${{ runner.temp }}/hosted-release-version
          if-no-files-found: error

  publish-github-source:
    name: Publish tested GitHub source release
    if: >-
      github.repository == 'nanoodlecom/nanoodle-mcp' && github.ref == 'refs/heads/main' &&
      needs.qualify-github-source.outputs.version != '' &&
      needs.qualify-github-source.outputs.version == needs.package.outputs.version &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.github_source_only || inputs.deployed_revision != '')
    needs: [package, qualify-github-source]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: github-source-${{ needs.qualify-github-source.outputs.version }}
      cancel-in-progress: false
    steps:
      - name: Patch system trust before dependency or release downloads
        timeout-minutes: 2
        run: |
          minimum=20260816ubuntu0.24.04.1
          installed="$(dpkg-query -W -f='${Version}' ca-certificates)"
          if ! dpkg --compare-versions "$installed" ge "$minimum"; then
            sudo apt-get update
            sudo apt-get install -y --only-upgrade ca-certificates
            dpkg --compare-versions "$(dpkg-query -W -f='${Version}' ca-certificates)" ge "$minimum"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.3'
      - name: Tag and release the tested source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_VERSION: ${{ needs.qualify-github-source.outputs.version }}
          SOURCE_ONLY: ${{ inputs.github_source_only || inputs.deployed_revision != '' }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: node .github/scripts/publish_source.mjs publish "$SOURCE_VERSION"

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Patch system trust before dependency or release downloads
        timeout-minutes: 2
        run: |
          minimum=20260816ubuntu0.24.04.1
          installed="$(dpkg-query -W -f='${Version}' ca-certificates)"
          if ! dpkg --compare-versions "$installed" ge "$minimum"; then
            sudo apt-get update
            sudo apt-get install -y --only-upgrade ca-certificates
            dpkg --compare-versions "$(dpkg-query -W -f='${Version}' ca-certificates)" ge "$minimum"
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.3"
      - name: Restore pinned ffmpeg archive
        id: ffmpeg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
        with:
          path: /tmp/ffmpeg.tar.xz
          key: ffmpeg-7.0.2-linux-amd64-abda8d77ce8309141f83ab8edf0596834087c52467f6badf376a6a2a4c87cf67
      # The apt ffmpeg package is about 94MB across 99 dependencies, fetched
      # from the Azure Ubuntu mirror. That download has no bound of its own,
      # and this job's 10-minute limit has cancelled the run while libavcodec
      # was still transferring. Tests only need ffmpeg and ffprobe, including
      # the lavfi color source, so install one pinned static build instead.
      - name: Install ffmpeg
        run: |
          set -euo pipefail
          url=https://johnvansickle.com/ffmpeg/releases/ffmpeg-7.0.2-amd64-static.tar.xz
          verify_ffmpeg() {
            echo "abda8d77ce8309141f83ab8edf0596834087c52467f6badf376a6a2a4c87cf67  /tmp/ffmpeg.tar.xz" | sha256sum -c
          }
          if ! { test -f /tmp/ffmpeg.tar.xz && verify_ffmpeg; }; then
            for attempt in 1 2; do
              rm -f /tmp/ffmpeg.tar.xz
              if curl -fsSL --connect-timeout 10 --max-time 45 -H 'Cache-Control: no-cache' "$url" -o /tmp/ffmpeg.tar.xz && verify_ffmpeg; then
                break
              fi
            done
          fi
          # Cache hits and both download attempts must pass the unchanged pin.
          verify_ffmpeg
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
          sudo install -m 755 /tmp/ffmpeg-7.0.2-amd64-static/ffmpeg /tmp/ffmpeg-7.0.2-amd64-static/ffprobe /usr/local/bin/
          ffmpeg -hide_banner -version
          ffprobe -hide_banner -version
      - name: Cache verified ffmpeg archive
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: /tmp/ffmpeg.tar.xz
          key: ffmpeg-7.0.2-linux-amd64-abda8d77ce8309141f83ab8edf0596834087c52467f6badf376a6a2a4c87cf67
      - run: npm ci
      - run: npm test
      - name: Simulate Market hires with local stand-ins
        run: npm run simulate:market

  package:
    name: Pack and install the MCP release
    if: github.event_name == 'pull_request' || (github.repository == 'nanoodlecom/nanoodle-mcp' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.pack.outputs.version }}
    steps:
      - name: Patch system trust before dependency or release downloads
        timeout-minutes: 2
        run: |
          minimum=20260816ubuntu0.24.04.1
          installed="$(dpkg-query -W -f='${Version}' ca-certificates)"
          if ! dpkg --compare-versions "$installed" ge "$minimum"; then
            sudo apt-get update
            sudo apt-get install -y --only-upgrade ca-certificates
            dpkg --compare-versions "$(dpkg-query -W -f='${Version}' ca-certificates)" ge "$minimum"
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - name: Build and install the release tarball outside the checkout
        id: pack
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          npm ci --omit=dev --ignore-scripts
          mkdir "$RUNNER_TEMP/consumer"
          version="$(node -p 'require("./package.json").version')"
          sdk_identity="$(node -p 'const {version,resolved,integrity} = require("./package-lock.json").packages["node_modules/nanoodle"]; JSON.stringify([version,resolved,integrity])')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$REQUESTED_VERSION" != "$version" ]]; then
            echo "Requested version must match package.json on the tested main revision" >&2
            exit 1
          fi
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/nanoodle-mcp-$version.tgz" "$RUNNER_TEMP/nanoodle-mcp.tgz"
          cd "$RUNNER_TEMP/consumer"
          npm install --omit=dev --ignore-scripts "$RUNNER_TEMP/nanoodle-mcp.tgz"
          test "$(node_modules/.bin/nanoodle-mcp --version)" = "nanoodle-mcp $version"
          SDK_IDENTITY="$sdk_identity" node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { createRequire } from "node:module";
          import { dirname, relative } from "node:path";
          import { noodleGuide } from "nanoodle-mcp/src/tools.mjs";
          const require = createRequire(import.meta.url);
          const manifest = require.resolve("nanoodle/package.json", { paths: ["./node_modules/nanoodle-mcp"] });
          const key = relative(process.cwd(), dirname(manifest));
          const { version, resolved, integrity } = require("./package-lock.json").packages[key];
          assert.ok(resolved && integrity, "the installed SDK has locked provenance");
          assert.equal(require(manifest).version, version);
          assert.deepEqual([version, resolved, integrity], JSON.parse(process.env.SDK_IDENTITY));
          for (const type of ["slice-3d", "sprite-stack-render"]) {
            const guide = await noodleGuide({ node_type: type });
            assert.ok(guide.structuredContent.nodeTypes.find(n => n.type === type)?.settings.length);
          }
          JS
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: npm-distribution
          path: ${{ runner.temp }}/nanoodle-mcp.tgz
          if-no-files-found: error

  publish-npm:
    name: Publish the tested npm package
    if: >-
      github.repository == 'nanoodlecom/nanoodle-mcp' && github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && !inputs.github_source_only
    needs: [package, qualify-github-source]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    environment:
      name: npm
      url: https://www.npmjs.com/package/nanoodle-mcp/v/${{ needs.package.outputs.version }}
    permissions:
      id-token: write
    steps:
      - name: Patch system trust before dependency or release downloads
        timeout-minutes: 2
        run: |
          minimum=20260816ubuntu0.24.04.1
          installed="$(dpkg-query -W -f='${Version}' ca-certificates)"
          if ! dpkg --compare-versions "$installed" ge "$minimum"; then
            sudo apt-get update
            sudo apt-get install -y --only-upgrade ca-certificates
            dpkg --compare-versions "$(dpkg-query -W -f='${Version}' ca-certificates)" ge "$minimum"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-distribution
      - name: Publish if this version is absent from npm
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          registry_url="https://registry.npmjs.org/nanoodle-mcp/$VERSION"
          registry_metadata="$RUNNER_TEMP/npm-version.json"
          archive_integrity="sha512-$(openssl dgst -sha512 -binary nanoodle-mcp.tgz | openssl base64 -A)"
          verify_registry_archive() {
            if ! jq -e --arg version "$VERSION" --arg integrity "$archive_integrity" \
              '.name == "nanoodle-mcp" and .version == $version and .mcpName == "io.github.nanoodlecom/nanoodle-mcp" and .dist.integrity == $integrity' \
              "$registry_metadata" >/dev/null; then
              echo "npm metadata for nanoodle-mcp@$VERSION does not match the tested archive" >&2
              return 1
            fi
          }
          status="$(curl --silent --show-error --retry 2 --max-time 30 \
            --output "$registry_metadata" --write-out '%{http_code}' "$registry_url")"
          case "$status" in
            200)
              verify_registry_archive
              echo "The tested nanoodle-mcp@$VERSION archive is already published"
              ;;
            404)
              flags=()
              if [[ "$VERSION" == *-* ]]; then flags+=(--tag next); fi
              npm publish ./nanoodle-mcp.tgz --ignore-scripts --access public "${flags[@]}"
              # npm can acknowledge a publish before the version is visible to reads.
              curl --fail --silent --show-error --retry 36 --retry-all-errors --retry-delay 5 \
                --retry-max-time 180 --max-time 10 --output "$registry_metadata" "$registry_url"
              verify_registry_archive
              ;;
            *) echo "npm version lookup returned HTTP $status" >&2; exit 1 ;;
          esac

  publish-registry:
    name: Publish to the MCP Registry
    needs: [package, publish-npm]
    uses: ./.github/workflows/publish-mcp-registry.yml
    with:
      version: ${{ needs.package.outputs.version }}
    permissions:
      contents: read
      id-token: write
