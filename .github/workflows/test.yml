name: test

# The suite spawns the real server against a canned local NanoGPT stub. Nothing
# here spends money or needs a secret. One test HEADs the landing page's public
# preview images on media.nanoodle.com; NANOODLE_OFFLINE=1 skips it.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --use-openssl-ca
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_DIR: /etc/ssl/certs
      npm_config_cafile: /etc/ssl/certs/ca-certificates.crt
      npm_config_strict_ssl: "true"
    steps:
      - name: Patch system trust before dependency or release downloads
        run: |
          sudo apt-get update
          sudo apt-get install -y --only-upgrade ca-certificates
          dpkg --compare-versions "$(dpkg-query -W -f='${Version}' ca-certificates)" ge 20260816ubuntu0.24.04.1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
      - run: npm ci
      - run: npm test
