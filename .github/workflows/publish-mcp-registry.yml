name: publish-mcp-registry

# Publishes server.json to the official MCP registry
# (registry.modelcontextprotocol.io). OIDC from this org repo grants the
# io.github.nanoodlecom/* namespace — no interactive login, no secrets.
#
# Run it manually after each npm publish (PUBLISHING.md has the version-bump
# rule: package.json + server.json version + server.json packages[0].version).

on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --use-openssl-ca
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_DIR: /etc/ssl/certs
      npm_config_cafile: /etc/ssl/certs/ca-certificates.crt
      npm_config_strict_ssl: "true"
    steps:
      - name: Patch system trust before dependency or release downloads
        run: |
          sudo apt-get update
          sudo apt-get install -y --only-upgrade ca-certificates
          dpkg --compare-versions "$(dpkg-query -W -f='${Version}' ca-certificates)" ge 20260816ubuntu0.24.04.1
      - uses: actions/checkout@v4

      # server.json is the registry entry, package.json is what npm published.
      # If they disagree, the registry lists metadata for a version that is not
      # the tarball it points at. Stop before the publish, not after.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard the release manifests
        run: node --test tests/manifest-versions.test.mjs

      # The guard above is offline: every assertion in it compares repo files to
      # each other, so it passes whenever server.json matches package.json — even
      # if npm has never published that version. This step asks npm. The registry
      # entry points at an npm tarball, so the tarball must exist first.
      - name: Assert the release is published on npm
        run: node scripts/assert-npm-version.mjs

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Publish to MCP registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
