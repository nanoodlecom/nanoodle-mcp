name: publish-mcp-registry

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Exact published MCP version to register
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_DIR: /etc/ssl/certs
  npm_config_cafile: /etc/ssl/certs/ca-certificates.crt
  npm_config_strict_ssl: "true"

jobs:
  publish:
    if: github.repository == 'nanoodlecom/nanoodle-mcp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: mcp-registry-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Patch system trust before dependency or release downloads
        timeout-minutes: 2
        run: |
          sudo apt-get update
          sudo apt-get install -y --only-upgrade ca-certificates
          dpkg --compare-versions "$(dpkg-query -W -f='${Version}' ca-certificates)" ge 20260816ubuntu0.24.04.1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - name: Guard the release manifests and requested version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node --test tests/manifest-versions.test.mjs
          if [[ "$(jq -er '.version' server.json)" != "$REQUESTED_VERSION" ]]; then
            echo "Requested version must match server.json on the tested main revision" >&2
            exit 1
          fi
      - name: Assert the release is published on npm
        run: node scripts/assert-npm-version.mjs
      - name: Check the exact MCP Registry version
        id: existing
        run: |
          server="$(jq -er '.name | @uri' server.json)"
          version="$(jq -er '.version | @uri' server.json)"
          status="$(curl --silent --show-error --retry 2 --max-time 30 \
            --output "$RUNNER_TEMP/mcp-version.json" --write-out '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0.1/servers/$server/versions/$version")"
          case "$status" in
            200)
              jq -e --slurpfile desired server.json '
                .server.name == $desired[0].name and .server.version == $desired[0].version and
                any(.server.packages[]; .registryType == "npm" and .identifier == "nanoodle-mcp" and .version == $desired[0].version)
              ' "$RUNNER_TEMP/mcp-version.json" >/dev/null
              echo "MCP Registry already lists $(jq -r '.version' server.json)"
              ;;
            404) echo 'publish=true' >> "$GITHUB_OUTPUT" ;;
            *) echo "MCP Registry version lookup returned HTTP $status" >&2; exit 1 ;;
          esac
      - name: Install verified MCP publisher
        if: steps.existing.outputs.publish == 'true'
        run: |
          archive="$RUNNER_TEMP/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL --retry 2 --max-time 90 --output "$archive" \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz
          printf '%s  %s\n' 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8 "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" mcp-publisher
      - name: Publish to the MCP Registry
        if: steps.existing.outputs.publish == 'true'
        run: |
          "$RUNNER_TEMP"/mcp-publisher login github-oidc
          "$RUNNER_TEMP"/mcp-publisher publish
